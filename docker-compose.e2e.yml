# Dev/CI-only additive overlay (INFRA-01, phase 11 plan 03) - boots the
# built `app` image in production shape for the Playwright E2E suite. Purely
# additive on top of docker-compose.yml + docker-compose.dev.yml: adds a new
# host port for `db` and pins deterministic test env on `app`. NEVER
# referenced by docker-compose.yml or docker-compose.dev.yml themselves, and
# never used outside dev/CI.
#
# Usage: docker compose -p zack-e2e \
#          -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml \
#          up -d --wait
# (see scripts/e2e-compose.sh for the full boot/run/always-teardown flow)

services:
  db:
    ports:
      # Distinct host port from the app's internal 5432 (INFRA-03) so the
      # host Playwright test runner can connect directly for seed/reset,
      # separate from docker-compose.yml's `db` service (no published port
      # in prod) and from apps/api's own ephemeral Vitest testcontainers.
      - "5433:5432"

  # Mock OIDC Identity Provider (13-01-PLAN.md, AUTH-E2E-04/05) -- the
  # repo's first mock IdP. Host-published (unlike `db`'s dev-only 5433/
  # mailpit's 8025) because ONE hop of the OAuth dance -- the browser's
  # authorization redirect -- is genuinely browser-driven, not
  # server-to-server; the discovery-document rewrite inside
  # apps/e2e/oidc-mock/server.mjs is what lets `app` (server-to-server
  # discovery/token/userinfo) and the host browser (authorization redirect
  # only) each reach the same IdP over their own correct network path.
  # NEVER add this service (or the app's OIDC_* env below) to
  # docker-compose.yml/docker-compose.dev.yml -- SSO stays structurally
  # absent from every real config surface, mirroring E2E_COMPOSE_OVERLAY.
  oidc-mock:
    build: ./apps/e2e/oidc-mock
    ports:
      - "9000:9000"
    environment:
      OIDC_MOCK_PORT: "9000"
      # What `app` fetches discovery/token/userinfo from (Docker-internal).
      OIDC_MOCK_INTERNAL_URL: "http://oidc-mock:9000"
      # What the host browser is redirected to for the authorization hop.
      OIDC_MOCK_PUBLIC_URL: "http://localhost:9000"
      OIDC_MOCK_CLIENT_ID: "zack-e2e-oidc-client"
      OIDC_MOCK_CLIENT_SECRET: "zack-e2e-oidc-secret"
      # MUST equal ssoConfig.ts's ssoCallbackPath("http://localhost:3000")
      # for provider id "oidc" (D-10-06) -- both sides derive the same
      # genericOAuth callback path.
      OIDC_MOCK_REDIRECT_URI: "http://localhost:3000/api/auth/oauth2/callback/oidc"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    depends_on:
      oidc-mock:
        condition: service_healthy
    environment:
      # CR-05 (11-REVIEW.md iteration 2) — a fixed literal, NOT interpolated
      # from the script's/CI's own environment (unlike
      # E2E_RATE_LIMIT_BYPASS_SECRET below): the narrow "this boot IS the
      # E2E compose overlay" signal apps/api/src/env.ts's WR-03 boot guard
      # and apps/api/src/plugins/rateLimit.ts's CR-02 gate both key off
      # instead of NODE_ENV (which stays "production" here on purpose, per
      # INFRA-01 — production-SHAPE topology fidelity). NEVER add this key
      # to docker-compose.yml, docker-compose.dev.yml, or .env.example — its
      # entire value is being structurally absent from every real-production
      # config surface, mirroring E2E_RATE_LIMIT_BYPASS_SECRET's own
      # discipline.
      E2E_COMPOSE_OVERLAY: "true"
      # Route the built image's nodemailer client at the existing
      # dev-overlay Mailpit instance (never a real SMTP provider, never a
      # second Mailpit) so magic-link emails are host-readable via
      # Mailpit's REST API on :8025.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: no-reply@e2e.zack.local
      # Host-followable magic-link URLs - the built image is published on
      # :3000, the same origin the host Playwright browser/request context
      # talks to.
      BASE_URL: http://localhost:3000
      # Deterministic first-admin bootstrap so auth.setup.ts's seeded admin
      # row passes the invite-only allowlist (isEmailAllowed).
      INITIAL_ADMIN_EMAIL: admin@e2e.zack.local
      # Narrow rate-limit bypass secret (INFRA-06, T-11-01) - interpolated
      # from the script's/CI's own environment, NEVER a literal default
      # here and NEVER present in docker-compose.yml/prod.
      #
      # WR-03 (13-REVIEW.md): `:?` required-variable guard - `scripts/
      # e2e-compose.sh` (the documented canonical entrypoint) always
      # exports a generated value first, but without this guard, invoking
      # `docker compose -f ... up -d --wait` directly (as this file's own
      # header comment shows) would let Compose silently substitute an
      # empty string on a non-fatal stderr warning, handing the app an
      # empty bypass secret instead of failing the boot loudly.
      E2E_RATE_LIMIT_BYPASS_SECRET: ${E2E_RATE_LIMIT_BYPASS_SECRET:?E2E_RATE_LIMIT_BYPASS_SECRET must be set — run via scripts/e2e-compose.sh}
      # All-three-present (D-10-07) so readSsoConfig() returns non-null ->
      # genericOAuth registers -> /api/auth/sign-in/oauth2 exists and the
      # login view's SSO button appears. app-container-facing issuer
      # (Docker-internal) -- matches ssoDiscoveryUrl()'s fetch origin
      # (D-10-03). NEVER add these three keys to docker-compose.yml,
      # docker-compose.dev.yml, or .env.example -- SSO stays structurally
      # absent from every real config surface.
      OIDC_ISSUER_URL: "http://oidc-mock:9000"
      OIDC_CLIENT_ID: "zack-e2e-oidc-client"
      OIDC_CLIENT_SECRET: "zack-e2e-oidc-secret"
