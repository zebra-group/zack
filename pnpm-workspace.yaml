packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+ blocks dependency lifecycle (postinstall/preinstall/install) scripts
# by default. Prisma relies on a postinstall hook to run `prisma generate`,
# so it must be explicitly allowlisted here — otherwise `pnpm install`
# succeeds silently while the generated Prisma client never gets created
# (see 01-RESEARCH.md Pitfall 1).
allowBuilds:
  prisma: true
  "@prisma/client": true
  # Sub-package of prisma itself (same vetted repo/org) — its postinstall
  # downloads the Prisma query-engine binaries; without it `prisma generate`
  # / `prisma migrate deploy` cannot function.
  "@prisma/engines": true
  # esbuild's postinstall installs the correct platform binary; tsup (apps/api
  # build) and Vite (apps/web build) both depend on esbuild transitively —
  # without approval neither app can build.
  esbuild: true
  # Transitive deps of testcontainers' docker client (dockerode), only
  # relevant for SSH-based remote Docker hosts. Not used by this project
  # (local Docker socket only) and not exercised until plan 01-05 wires the
  # testcontainers globalSetup — left unapproved per the "no blanket
  # lifecycle-script enablement" mitigation (threat T-01-02).
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Transitive optional dependency of better-auth's kysely/drizzle adapter
  # packages (pulled in because better-auth@1.6.x now bundles ALL its
  # first-party adapter subpackages, including ones this project never
  # imports). This project is Postgres-only (better-auth/adapters/prisma,
  # bundled path per 02-RESEARCH.md A1) and never touches SQLite — same
  # "no blanket lifecycle-script enablement" rationale as cpu-features/
  # protobufjs/ssh2 above (threat T-01-02).
  better-sqlite3: false

minimumReleaseAgeExclude:
  - '@semantic-release/git@11.0.1'

# Range-scoped security overrides (Dependabot alert remediation, quick task
# 260728-fxv). Each key is scoped to the exact major/range line a real parent
# declares, so an override never bleeds into an incompatible major consumed
# elsewhere in the tree (see 260728-fxv-PLAN.md <override_matrix>).
overrides:
  find-my-way@<9.7.0: ^9.7.0
  fast-uri@3: ^3.1.4
  fast-uri@4: ^4.1.1
  postcss@<8.5.18: ^8.5.18
  brace-expansion@5: ^5.0.8
  '@hono/node-server@1': ^1.19.13
  valibot@1: ^1.4.2
  drizzle-orm@<0.45.2: ^0.45.2
  esbuild@0.27: 0.28.1
