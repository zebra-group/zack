# Zack CI (D-11 — the TDD mandate is only real if it's enforced on every
# change). Runs on every push and pull_request: install, generate the
# Prisma client explicitly, build the workspace topologically
# (packages/shared before apps/*), typecheck, and run the FULL Vitest
# suite — including the real-Postgres integration tests, which spin up a
# testcontainers Postgres per D-09 (ubuntu-latest ships Docker
# preinstalled, so no extra `services:` config is needed here — see
# 01-RESEARCH.md Environment Availability / CI workflow skeleton).
#
# The compose-driven smoke scripts (scripts/smoke-compose.sh,
# scripts/smoke-persistence.sh — INFRA-01/INFRA-03) need the built Docker
# image rather than the raw workspace, so they run as a separate `smoke`
# job that only starts once `test` is green.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Explicit `prisma generate` (belt-and-suspenders alongside
      # pnpm-workspace.yaml's allowBuilds postinstall approval —
      # 01-RESEARCH.md Pitfall 1). prisma.config.ts resolves DATABASE_URL
      # eagerly via env() even for `generate`, which never opens a DB
      # connection, so a placeholder value unblocks config loading without
      # a real database at this step (same pattern as the Dockerfile build
      # stage).
      - name: Generate Prisma client
        run: pnpm --filter @zack/api exec prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      # Topological build: packages/shared builds before apps/web and
      # apps/api, since both declare it as a workspace:* dependency (pnpm
      # resolves the dependency graph, not directory order —
      # 01-RESEARCH.md Pitfall 2).
      - name: Build
        run: pnpm run -r build

      - name: Typecheck
        run: pnpm run typecheck

      # Spins up testcontainers Postgres per D-09 (one shared container per
      # Vitest run, each test wrapped in a rolled-back transaction).
      #
      # @zack/e2e is explicitly excluded here (CR-01): its own "test"
      # script runs the full Playwright suite, which requires installed
      # browsers and a live app server — neither of which exist in this
      # job. That suite runs in the dedicated `e2e` job below via
      # scripts/e2e-compose.sh (pnpm --filter @zack/e2e test), against
      # the built app image, once browsers are installed.
      - name: Test
        run: pnpm run -r --filter='!@zack/e2e' test

  smoke:
    name: Compose boot & persistence smoke tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build the app image
        run: docker compose -f docker-compose.yml build app

      - name: Boot smoke test (INFRA-01 — docker compose up requires no manual steps)
        run: ./scripts/smoke-compose.sh

      - name: Persistence smoke test (INFRA-03 — data survives down/up without -v)
        run: ./scripts/smoke-persistence.sh

  # Playwright E2E suite (11-06-PLAN.md, INFRA-05). Sequenced after `smoke`
  # (not merged into it) so the heavier Playwright browser install only pays
  # once `smoke` already proved the built image itself boots cleanly.
  # Exercises the entire suite from Phase 11's Plans 01-05 (fixtures,
  # storageState, DB/Mailpit isolation) plus this plan's own rate-limit
  # bypass proof, against the SAME built app image via
  # scripts/e2e-compose.sh. Report/trace artifacts are only uploaded on
  # failure to avoid noise on green runs.
  e2e:
    name: Playwright E2E suite
    runs-on: ubuntu-latest
    needs: [test, smoke]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/e2e/src/db.ts imports @zack/api's generated Prisma client
      # directly as workspace TS source (the "./prisma-client" export in
      # apps/api/package.json) and runs on THIS runner, not inside the app
      # container — so it needs its own `prisma generate`, independent of
      # the Docker image build below (same step as the `test` job, D-11).
      - name: Generate Prisma client
        run: pnpm --filter @zack/api exec prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      # Fresh browser install every run (11-RESEARCH.md Pitfall 7) —
      # deliberately no ~/.cache/ms-playwright cache step, since a stale
      # cache pinned to an old Chromium build is a documented footgun.
      - name: Install Playwright browsers
        run: pnpm --filter @zack/e2e exec playwright install --with-deps chromium

      - name: Build the app image
        run: docker compose -f docker-compose.yml build app

      # Generated fresh every run, scoped to this job's own env only
      # (T-11-01) — never a fixed/committed literal, never bare
      # github.run_id. scripts/e2e-compose.sh would generate its own
      # fallback if this were unset, but CI injects an explicit one so the
      # secret's provenance for this job is visible directly in this
      # workflow file.
      - name: Generate E2E rate-limit bypass secret
        id: bypass-secret
        run: echo "value=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"

      - name: Run Playwright E2E suite
        run: ./scripts/e2e-compose.sh
        env:
          E2E_RATE_LIMIT_BYPASS_SECRET: ${{ steps.bypass-secret.outputs.value }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/e2e/test-results/
          retention-days: 7

  # `release` lives in this same workflow file (not a separate
  # release-publish.yml) because gating on CI success via `needs:` only
  # works between jobs in the same workflow - a separate file would need
  # the more fragile `workflow_run` trigger (default-branch workflow
  # definition, ref/SHA ambiguity). Mirrors the `smoke needs: test` shape.
  #
  # This single job both cuts the release (semantic-release, analyzing
  # conventional commits since the last tag) AND, only when a release was
  # actually cut this run, builds/pushes the versioned GHCR image. A plain
  # push-triggered job has no release-event context to learn "did a
  # release just happen?" from, so the job detects it itself with a git
  # tag diff: capture the latest tag before running semantic-release,
  # re-fetch tags after (semantic-release pushes the new tag to the
  # remote), and compare. Only a differing/non-empty post tag flips
  # `released=true`, which gates every docker step below - a no-op run
  # (e.g. a docs-only commit) builds nothing. No PAT, no extra package,
  # no separate workflow: every step here authenticates with the one
  # built-in GITHUB_TOKEN.
  release:
    name: Release and publish image to GHCR
    runs-on: ubuntu-latest
    # WR-01 (11-REVIEW.md): `e2e` added to `needs` so a failing (or racing)
    # Playwright E2E suite blocks release/publish — without it, `e2e` and
    # `release` both only depended on [test, smoke] and ran in parallel,
    # letting a version get cut and an image get published to GHCR even
    # when the E2E suite (validating the redirect handler as actually
    # deployed — this project's Core Value) failed.
    needs: [test, smoke, e2e]
    # Fork-safety guard (mitigates T-gsf-02): skipped on all pull_request
    # events and all non-main branch pushes, so a fork PR never reaches a
    # step that could hold this job's write-scoped GITHUB_TOKEN.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      # Default credential persistence is required (not disabled) so
      # @semantic-release/git's push of the release tag + write-back
      # commit authenticates with the built-in GITHUB_TOKEN.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture pre-release tag
        id: pre
        run: echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture post-release tag
        id: post
        run: |
          git fetch --tags --force
          echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Check for new release
        id: check
        run: |
          if [ -n "${{ steps.post.outputs.tag }}" ] && [ "${{ steps.post.outputs.tag }}" != "${{ steps.pre.outputs.tag }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            version="${{ steps.post.outputs.tag }}"
            version="${version#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            IFS=. read -r major minor patch <<< "$version"
            echo "major=$major" >> "$GITHUB_OUTPUT"
            echo "minor=$minor" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # Required because the Dockerfile uses BuildKit features
      # (--mount=type=cache and # syntax=docker/dockerfile:1.7).
      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.released == 'true'

      - uses: docker/login-action@v4
        if: steps.check.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        if: steps.check.outputs.released == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.check.outputs.version }}
            type=raw,value=${{ steps.check.outputs.major }}.${{ steps.check.outputs.minor }}
            type=raw,value=${{ steps.check.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        if: steps.check.outputs.released == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
